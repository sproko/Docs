# Standard settings for a deployed Debian box, shared by the USB installer
# (build-iso.sh bakes them into the preseed) and bootstrap.sh (which also reads
# them from /usr/local/share/deploy on an installed box).
#
# Plain sh variable assignments only. Nothing secret goes here: this repo is
# public. Password hashes and SSH keys live in secrets.conf (gitignored), which
# make-secrets.sh writes.

# Until the first-boot dialog asks for the real name
DEFAULT_HOSTNAME="debian"

# The standard non-root account. Joins the sudo group.
DEPLOY_USER="angstrom"
DEPLOY_USER_FULLNAME="angstrom"
# The installer creates the account on bash; bootstrap.sh switches it once zsh
# is installed. Root stays on bash.
DEPLOY_USER_SHELL="/usr/bin/zsh"

TIMEZONE="America/Toronto"
LOCALE="en_CA.UTF-8"
KEYMAP="us"

# LVM + ext4. A runaway log or database can fill /srv but not /, so the box
# stays reachable over SSH. Whatever the disk has beyond these is left free in
# the volume group, to grow any of them later with lvextend.
ROOT_SIZE_GB="20"
SWAP_SIZE_GB="4"
SRV_SIZE_GB="30"

# no | prohibit-password (keys only) | yes. The standard root password stays
# console/IPKVM-only unless this is "yes"; over SSH you log in as DEPLOY_USER.
SSH_PERMIT_ROOT_LOGIN="prohibit-password"

# Also run a console on the first serial port (115200). Video stays primary,
# so a monitor or IPKVM sees everything; serial is a fallback for headless use.
SERIAL_CONSOLE="yes"

# Kernel crash dumps. Reserves RAM for a capture kernel (192 MB on a 4 GB box)
# for as long as the box runs.
KDUMP="yes"

# Install security updates automatically (unattended-upgrades). Never reboots.
AUTO_SECURITY_UPDATES="yes"

# Oh My Zsh isn't packaged for Debian, so the stick carries this commit of it.
OHMYZSH_REF="d2b7f557cceaddb16ba89bbf8200d8a8df35c4d8"

# Neovim, tree-sitter and herdr (herdr.dev) come from their GitHub releases:
# the newest as of the build, refreshed by each online bootstrap.sh run.

# Claude Code (the CLI) from Anthropic's signed apt repo, verified with
# keys/claude-code.asc (fingerprint 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE).
# latest: every release as it ships. stable: about a week behind, skipping
# releases with regressions.
CLAUDE_CODE_CHANNEL="latest"
