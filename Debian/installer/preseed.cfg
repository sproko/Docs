#### Preseed for the deploy stick. build-iso.sh fills in the placeholders from
#### deploy.conf and secrets.conf and puts the result inside the installer's
#### initrd, so it applies from the first screen.
####
#### The only question left is which disk to install to. Network is off for the
#### whole install: everything comes from the stick, and the network is set up
#### by the first-boot dialog (firstboot/deploy-netconfig).

### Locale and keyboard
d-i debian-installer/language string en
d-i debian-installer/country string CA
d-i debian-installer/locale string @LOCALE@
d-i keyboard-configuration/xkb-keymap select @KEYMAP@

### Network: none during install
d-i netcfg/enable boolean false
d-i netcfg/hostname string @HOSTNAME@
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

### Mirror: none. The stick's own repo is added by late.sh.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true

### Accounts
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @ROOT_PW_HASH@
d-i passwd/make-user boolean true
d-i passwd/user-fullname string @USER_FULLNAME@
d-i passwd/username string @USER@
d-i passwd/user-password-crypted password @USER_PW_HASH@
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean false

### Disk: GPT, EFI + BIOS boot partitions (boots either way), /boot, then LVM
### with fixed-size root, swap and /srv. partman always hands leftover space
### to some LV, so "reserve" takes it and late.sh deletes it, leaving the rest
### of the disk free in the VG.
### partman-auto/disk is left unset on purpose: that's the one question.
d-i partman-auto/method string lvm
d-i partman-auto/init_automatically_partition select some_device_lvm
d-i partman-auto-lvm/new_vg_name string vg0
d-i partman-auto-lvm/guided_size string max
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select deploy
d-i partman-auto/expert_recipe string \
    deploy :: \
        1 1 1 free \
            $iflabel{ gpt } $reusemethod{ } method{ biosgrub } . \
        538 538 538 free \
            $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
        1024 1024 1024 ext4 \
            method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } . \
        @ROOT_MB@ @ROOT_MB@ @ROOT_MB@ ext4 \
            $lvmok{ } lv_name{ root } method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
        @SWAP_MB@ @SWAP_MB@ @SWAP_MB@ linux-swap \
            $lvmok{ } lv_name{ swap } method{ swap } format{ } . \
        @SRV_MB@ @SRV_MB@ @SRV_MB@ ext4 \
            $lvmok{ } lv_name{ srv } method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ /srv } . \
        1 1 -1 ext4 \
            $lvmok{ } lv_name{ reserve } method{ keep } .
d-i partman-partitioning/confirm_write_new_label boolean true
# The reserve LV has no filesystem on purpose; carry on without asking
d-i partman-basicmethods/method_only boolean false
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system and packages: just the base from the stick. Everything else is
### installed by late.sh from the deploy repo.
d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot loader. The extra removable-path copy (EFI/BOOT/BOOTX64.EFI) is for
### firmware that forgets or ignores the "debian" boot entry.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

### Finish
d-i preseed/late_command string sh /cdrom/deploy/installer/late.sh
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
