# Standard settings for a deployed FreeBSD box, shared by the USB installer
# (build-image.sh bakes this into the image) and provision.sh (which also reads
# it from /usr/local/etc/deploy.conf on an installed box).
#
# Plain sh variable assignments only. Nothing secret goes here: this repo is
# public. Password hashes and SSH keys live in secrets.conf (gitignored), which
# make-secrets.sh writes.

# Offered as the default at the installer's hostname prompt
DEFAULT_HOSTNAME="freebsd"

# The standard non-root account. Joins wheel, so it can su and sudo.
DEPLOY_USER="angstrom"
DEPLOY_USER_FULLNAME="angstrom"
# Must come from packages.txt. The installer starts the account on /bin/sh
# (no packages yet) and provision.sh switches it once this is installed.
# Root always stays on /bin/sh so it can log in even if /usr/local is broken.
DEPLOY_USER_SHELL="/usr/local/bin/zsh"

TIMEZONE="America/Toronto"

# Root filesystem: zfs (boot environments, snapshots) or ufs (small/old boxes)
FS_TYPE="zfs"
SWAP_SIZE="4g"
# Cap the ZFS read cache (ARC) at this share of RAM, leaving the rest for
# Postgres, NATS and our services. 25 = 1 GB on a 4 GB box.
ARC_MAX_PERCENT="25"

# no | prohibit-password (keys only) | yes. The standard root password stays
# console/IPKVM-only unless this is "yes"; over SSH you log in as DEPLOY_USER.
SSH_PERMIT_ROOT_LOGIN="prohibit-password"

# Also run a console on the first serial port (115200). Video stays primary,
# so a monitor or IPKVM sees everything; serial is a fallback for headless use.
SERIAL_CONSOLE="yes"

# Apply security patches with freebsd-update during provisioning
RUN_FREEBSD_UPDATE="yes"
